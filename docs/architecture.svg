<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#68686F"/></marker></defs>
<text x="40" y="36" font-size="20" font-weight="600" fill="#17171A">Tollgate: every AI action passes one gate; the agent holds no keys</text>
<rect x="40" y="56" width="12" height="12" rx="3" fill="#FFFFFF" stroke="#E6E4DF" stroke-width="1.25"/>
<text x="58" y="66" font-size="12" fill="#68686F">rule-based (same answer every time)</text>
<rect x="280" y="56" width="12" height="12" rx="3" fill="#F5F0E6" stroke="#7A5310" stroke-width="1.25"/>
<text x="298" y="66" font-size="12" fill="#68686F">uses AI, can only make a decision stricter</text>
<rect x="40" y="96" width="190" height="54" rx="8" fill="#FFFFFF" stroke="#E6E4DF" stroke-width="1.25"/><text x="54" y="120" font-size="14" font-weight="600" fill="#17171A">User</text><text x="54" y="138" font-size="12" fill="#68686F">asks in plain words</text>
<rect x="270" y="96" width="190" height="54" rx="8" fill="#FFFFFF" stroke="#E6E4DF" stroke-width="1.25"/><text x="284" y="120" font-size="14" font-weight="600" fill="#17171A">AI agent</text><text x="284" y="138" font-size="12" fill="#68686F">holds only the gate</text>
<rect x="500" y="96" width="190" height="54" rx="8" fill="#FFFFFF" stroke="#E6E4DF" stroke-width="1.25"/><text x="514" y="120" font-size="14" font-weight="600" fill="#17171A">Helper agents</text><text x="514" y="138" font-size="12" fill="#68686F">narrower token</text>
<rect x="730" y="96" width="190" height="54" rx="8" fill="#FFFFFF" stroke="#E6E4DF" stroke-width="1.25"/><text x="744" y="120" font-size="14" font-weight="600" fill="#17171A">Any MCP client</text><text x="744" y="138" font-size="12" fill="#68686F">same checks via MCP</text>
